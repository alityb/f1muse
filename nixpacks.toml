# Railway/Nixpacks build config.
# Keep this file because Railway is configured to read /nixpacks.toml.
# Do not pin Nix package names here; Nixpacks detects Node from package.json
# and Python from requirements.txt.

[phases.install]
cmds = [
  "npm ci --production=false",
  "python -m pip install -r requirements.txt"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
