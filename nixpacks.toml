# Railway/Nixpacks build config.
# Keep this file because Railway is configured to read /nixpacks.toml.
# Railway is configured to read /nixpacks.toml, so keep this file explicit.

[phases.setup]
aptPkgs = ["python3", "python3-pip", "python3-venv"]

[phases.install]
cmds = [
  "npm ci --production=false",
  "python3 -m venv .venv",
  ".venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
