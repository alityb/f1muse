name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit:db:docker
      - run: npm run test:golden:db
      - run: npm run test:integration:db
      - run: npm run test:schema:db
      - run: npm run test:api:inprocess
      - run: npm run test:f1ql
