name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/f1muse_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5433/f1muse_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/f1muse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --foreground-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit:db:docker
      - run: npm run test:golden:db
      - run: npm run test:integration:db
      - run: npm run test:schema:db
      - run: npm run test:api:inprocess
      - run: npm run test:f1ql
